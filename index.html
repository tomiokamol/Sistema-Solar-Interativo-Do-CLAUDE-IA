<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: palco de canvas em tela cheia, ficha lateral (bottom sheet no celular), controles na base. Visual escuro único, como o céu. */
:root{
  --bg:#05070f;
  --bg2:#090d1a;
  --surface:rgba(11,15,30,.9);
  --fg:#e9edf7;
  --muted:#8e99b5;
  --line:rgba(150,165,210,.18);
  --accent:#ffb454;
  --accent-ink:#1b1204;
  --good:#5fd0a0;
  --bad:#ff8a80;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

.hdr{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.hdr h1{margin:0;font:600 22px/1.2 var(--display);letter-spacing:-.01em}
.hdr p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:40ch}
.quizmode .hdr{display:none}

.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;bottom:16px;width:340px;overflow-y:auto;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;visibility:hidden;opacity:0;transform:translateX(24px);transition:opacity .25s,transform .25s,visibility .25s}
.panel.open{visibility:visible;opacity:1;transform:none}
.close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font:400 20px/1 var(--body);cursor:pointer}
.close:hover{color:var(--fg);border-color:var(--muted)}
.ph{display:flex;align-items:center;gap:14px;padding-right:36px}
.orb{flex:none;width:56px;height:56px;border-radius:50%;box-shadow:0 0 24px rgba(255,255,255,.06)}
.tag{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ph h2{margin:2px 0 0;font:600 24px/1.1 var(--display);letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font:500 13px/1.35 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts .w{grid-column:1/-1}
.fun{border-top:1px solid var(--line);padding-top:14px}
.fun h3{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fun p{margin:0;font-size:14px;line-height:1.55}
.note{margin:0;font-size:12px;color:var(--muted)}

.quiz{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:520px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.q-top{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q-top .sp{flex:1}
.q-text{margin:0;font:500 17px/1.35 var(--display);text-wrap:balance}
.q-fb{margin:0;font-size:13px;color:var(--muted);min-height:1.5em}
.q-fb.ok{color:var(--good)}
.q-fb.bad{color:var(--bad)}
.q-fb.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.dock{border-top:1px solid var(--line);background:var(--bg2);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.btn{font:500 13px/1.2 var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.sysbox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
select{font:500 13px/1.2 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;max-width:100%;cursor:pointer}
select option{background:#0b0f1e;color:#e9edf7}
.speed{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.speed output{font:500 12px var(--mono);color:var(--fg);min-width:3.2em;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:110px}
.grow{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,180,84,.1)}
.dot{width:10px;height:10px;border-radius:50%}

.credit{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.credit strong{color:var(--fg);font-weight:600}
.credit em{color:var(--accent);font-style:italic}

@media (max-width:720px){
  .panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;bottom:12px;width:auto;max-height:50%;transform:translateY(24px)}
  .quiz{max-width:none}
  .grow{display:none}
}
@media (min-width:721px){
  .quiz{right:auto;width:min(520px,calc(100% - 440px))}
}
@media (prefers-reduced-motion:reduce){
  .panel,.q-fb.shake{transition:none;animation:none}
}
</style>

</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" aria-label="Sistema estelar animado. Clique em um astro para ver a ficha ou use os botões abaixo."></canvas>

  <div class="hdr">
    <h1 id="htitle">Sistema Solar</h1>
    <p id="hsub"></p>
  </div>

  <div class="quiz" id="quiz" hidden>
    <div class="q-top"><span id="qcount"></span><span class="sp"></span><span id="qscore"></span><button class="btn" id="qexit" type="button">Sair</button></div>
    <p class="q-text" id="qtext"></p>
    <p class="q-fb" id="qfb" aria-live="polite"></p>
    <div><button class="btn primary" id="qnext" type="button" hidden>Próxima pergunta</button></div>

  <aside class="panel" id="panel" aria-label="Ficha do astro">
    <button class="close" id="pclose" type="button" aria-label="Fechar ficha">&times;</button>

      <div class="orb" id="orb"></div>
      <div><p class="tag" id="ptag"></p><h2 id="pname"></h2></div>
    </div>
    <dl class="facts" id="pfacts"></dl>
    <section class="fun"><h3>Curiosidade</h3><p id="pfun"></p></section>
    <p class="note" id="pnote"></p>
  </aside>
</div>

<div class="dock">
  <div class="ctrls">
    <label class="sysbox" for="sys">Sistema <select id="sys"></select></label>
    <button class="btn" id="bplay" type="button">Pausar</button>
    <label class="speed" for="rspeed">Velocidade <input id="rspeed" type="range" min="0.25" max="5" step="0.25" value="1"><output id="ospeed" for="rspeed">1×</output></label>
    <button class="btn" id="borb" type="button" aria-pressed="true">Órbitas</button>
    <button class="btn" id="blab" type="button" aria-pressed="true">Nomes</button>
    <span class="grow"></span>
    <button class="btn primary" id="bquiz" type="button">Desafio</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Escolher astro"></div>
  <p class="credit">Feito por <strong>Claude IA</strong> &middot; <em>&ldquo;I am your father&rdquo;</em></p>
</div>

/* ---------- Estado ---------- */
var stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
var panel=$('panel'),quizEl=$('quiz'),chips=$('chips');
var W=0,H=0,dpr=1,ax=0,ay=0,tp=0;
var cx=0,cy=0,R=100,sc=1,sunR=20,tilt=.52;
var simT=0,speed=reduce?.4:1,paused=false,showOrbits=true,showLabels=true,fade=1;
var cur=SYSTEMS[0],STAR=cur.star,PLANETS=[],BODIES=[],BYID={};
var sel=null,hoverId=null,mode='explore',quiz=null;
var stars=[];
for(var si=0;si<190;si++){stars.push({x:Math.random(),y:Math.random(),r:Math.random()<.12?2:1,a:.25+Math.random()*.6,sp:.6+Math.random()*1.8,ph:Math.random()*TAU});}

function target(){
  var open=panel.classList.contains('open');
  var wide=W>720;
  var top=wide?0:(mode==='quiz'?quizEl.offsetHeight+24:84);
  if(!open)return [W,H,top];
  if(wide)return [W-panel.offsetWidth-32,H,top];
  return [W,H-panel.offsetHeight-12,top];
}
function resize(){
  var r=stage.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var t=target();ax=t[0];ay=t[1];tp=t[2];
}
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}else{window.addEventListener('resize',resize);}
resize();

/* ---------- Troca de sistema ---------- */
function setSystem(s){
  if(mode==='quiz')exitQuiz();
  closePanel();
  cur=s;STAR=s.star;PLANETS=s.planets;
  BODIES=[STAR].concat(PLANETS);BYID={};
  BODIES.forEach(function(b){BYID[b.id]=b;b.x=0;b.y=0;b.r=10;});
  var n=PLANETS.length,i,p;
  /* órbitas: as do Sistema Solar já vêm prontas; as demais usam escala logarítmica da distância */
  var needOrbit=PLANETS.filter(function(q){return !q.orbit;});
  if(needOrbit.length){
    var aus=needOrbit.map(function(q){return q.au;});
    var amin=Math.min.apply(null,aus),amax=Math.max.apply(null,aus);
    for(i=0;i<needOrbit.length;i++){
      needOrbit[i].orbit=(needOrbit.length===1||amax===amin)?.62:.22+.78*(Math.log(needOrbit[i].au/amin)/Math.log(amax/amin));
    }
  }
  /* velocidades: a órbita mais rápida leva ~14 s, e a razão entre lenta e rápida fica limitada */
  var ps=PLANETS.map(function(q){return q.period;});
  var mn=Math.min.apply(null,ps),mx=Math.max.apply(null,ps);
  var ee=mx/mn>1.5?Math.min(.45,Math.log(10)/Math.log(mx/mn)):.45;
  var kk=14/Math.pow(mn,ee);
  for(i=0;i<n;i++){
    p=PLANETS[i];
    p.a0=i*2.4+.5;
    p.w=TAU/(kk*Math.pow(p.period,ee));
    if(!p.size)p.size=8.5*Math.pow(p.re,.28);
  }
  /* interface */
  $('htitle').textContent=s.name;
  $('hsub').textContent=s.sub;
  $('pnote').textContent=s.note;
  $('bquiz').hidden=!s.questions.length;
  $('sys').value=s.id;
  chips.innerHTML='';
  BODIES.forEach(function(b){
    var el=document.createElement('button');
    el.type='button';el.className='chip';el.setAttribute('data-id',b.id);el.setAttribute('aria-pressed','false');
    el.innerHTML='<span class="dot" style="background:'+b.c[1]+'"></span>'+b.name;
    el.addEventListener('click',function(){choose(b.id);});
    chips.appendChild(el);
  });
  fade=reduce?1:0;
}

function layout(){
  var aw=ax,ah=ay-tp;
  cx=aw/2;cy=tp+ah/2;
  tilt=W>720?.52:.7;
  R=Math.max(60,Math.min(aw/2-18,(ah/2-26)/tilt));
  sc=clamp(R/420,.55,1.25);
  sunR=clamp(R*.075,13,34);
  STAR.x=cx;STAR.y=cy;STAR.r=sunR*cur.starScale;STAR.ext=1;
  for(var i=0;i<PLANETS.length;i++){
    var p=PLANETS[i];
    var a=p.a0+simT*p.w;
    var rx=R*p.orbit,ry=rx*tilt;
    p.x=cx+Math.cos(a)*rx;p.y=cy+Math.sin(a)*ry;
    p.r=p.size*sc;
    p.ext=p.ring?2.2:1;
  }
}

/* ---------- Desenho ---------- */
function drawBody(x,y,r,p){
  var dx=cx-x,dy=cy-y,d=Math.sqrt(dx*dx+dy*dy)||1;
  var lx=dx/d,ly=dy/d;
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  ctx.fillStyle=p.c[1];ctx.fillRect(x-r,y-r,2*r,2*r);
  var k,s;
  if(p.bands){for(k=0;k<p.bands.length;k++){s=p.bands[k];ctx.fillStyle=s[2];ctx.fillRect(x-r,y+s[0]*r-s[1]*r/2,2*r,s[1]*r);}}
  if(p.blobs){for(k=0;k<p.blobs.length;k++){s=p.blobs[k];ctx.fillStyle=s[4];ctx.beginPath();ctx.ellipse(x+s[0]*r,y+s[1]*r,s[2]*r,s[3]*r,0,0,TAU);ctx.fill();}}
  var g=ctx.createRadialGradient(x+lx*r*.45,y+ly*r*.45,r*.1,x+lx*r*.2,y+ly*r*.2,r*1.25);
  g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(.45,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.8)');
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);
  ctx.restore();
}
function drawRing(x,y,r,front){
  var rings=[[1.55,.2,'rgba(230,205,150,.35)'],[1.8,.34,'rgba(240,220,170,.55)'],[2.1,.2,'rgba(210,185,135,.4)']];
  ctx.save();
  for(var i=0;i<rings.length;i++){
    ctx.strokeStyle=rings[i][2];ctx.lineWidth=Math.max(1,rings[i][1]*r);
    ctx.beginPath();
    ctx.ellipse(x,y,r*rings[i][0],r*rings[i][0]*.32,-.28,front?0:Math.PI,front?Math.PI:TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function draw(ts){
  ctx.globalAlpha=1;
  ctx.clearRect(0,0,W,H);
  var bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.7);
  bg.addColorStop(0,'#0e1530');bg.addColorStop(1,'#05070f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var i,s;
  for(i=0;i<stars.length;i++){
    s=stars[i];
    var al=reduce?s.a:s.a*(.65+.35*Math.sin(ts/1000*s.sp+s.ph));
    ctx.fillStyle='rgba(220,230,255,'+al.toFixed(3)+')';
    ctx.fillRect(s.x*W,s.y*H,s.r,s.r);
  }
  ctx.globalAlpha=fade;
  if(showOrbits){
    for(i=0;i<PLANETS.length;i++){
      var p0=PLANETS[i],rx=R*p0.orbit;
      ctx.strokeStyle=(sel===p0.id)?'rgba(255,180,84,.55)':'rgba(150,165,210,.16)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(cx,cy,rx,rx*tilt,0,0,TAU);ctx.stroke();
    }
  }
  var pulse=1+(reduce?0:.012*Math.sin(ts/900));
  var sr=STAR.r*pulse,gl=cur.star.glow;
  var g=ctx.createRadialGradient(cx,cy,STAR.r*.6,cx,cy,STAR.r*3.4);
  g.addColorStop(0,'rgba('+gl+',.38)');g.addColorStop(1,'rgba('+gl+',0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,STAR.r*3.4,0,TAU);ctx.fill();
  g=ctx.createRadialGradient(cx-sr*.25,cy-sr*.25,sr*.1,cx,cy,sr);
  g.addColorStop(0,STAR.c[0]);g.addColorStop(.55,STAR.c[1]);g.addColorStop(1,STAR.c[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,sr,0,TAU);ctx.fill();

  var order=PLANETS.slice().sort(function(a,b){return a.y-b.y;});
  for(i=0;i<order.length;i++){
    var p=order[i];
    if(p.ring)drawRing(p.x,p.y,p.r,false);
    drawBody(p.x,p.y,p.r,p);
    if(p.ring)drawRing(p.x,p.y,p.r,true);
    if(cur.id==='solar'&&p.id==='terra'){
      var ma=simT*8,mr=p.r*2.3;
      var mx=p.x+Math.cos(ma)*mr,my=p.y+Math.sin(ma)*mr*tilt;
      ctx.fillStyle='#c9ccd4';ctx.beginPath();ctx.arc(mx,my,Math.max(1.4,p.r*.26),0,TAU);ctx.fill();
    }
  }
  for(i=0;i<BODIES.length;i++){
    var b=BODIES[i];
    var rr=b.r*(b.ext||1)+6;
    if(sel===b.id){
      ctx.save();ctx.strokeStyle='#ffb454';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.lineDashOffset=-ts/80;
      ctx.beginPath();ctx.arc(b.x,b.y,rr,0,TAU);ctx.stroke();ctx.restore();
    }else if(hoverId===b.id){
      ctx.strokeStyle='rgba(233,237,247,.45)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x,b.y,rr,0,TAU);ctx.stroke();
    }
  }
  if(showLabels){
    ctx.font='500 11px Inter, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
    for(i=0;i<BODIES.length;i++){
      var q=BODIES[i];
      var on=(sel===q.id||hoverId===q.id);
      ctx.fillStyle=sel===q.id?'#ffb454':(on?'#e9edf7':'rgba(200,210,235,.62)');
      var off=q.r+(q.ring?10:8);
      var txt=(cur.shortLabels&&q!==STAR&&!on)?q.name.split(' ').pop():q.name;
      ctx.fillText(txt,q.x,q.y+off);
    }
  }
  ctx.globalAlpha=1;
}

var last=0;
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!paused)simT+=dt*speed;
  if(fade<1)fade=Math.min(1,fade+dt*2.2);
  var t=target(),k=Math.min(1,dt*8);
  ax+=(t[0]-ax)*k;ay+=(t[1]-ay)*k;tp+=(t[2]-tp)*k;
  layout();draw(ts);
  requestAnimationFrame(frame);
}

/* ---------- Interação ---------- */
function pickAt(e){
  var rc=cv.getBoundingClientRect();
  var x=e.clientX-rc.left,y=e.clientY-rc.top,best=null,bd=1e9;
  for(var i=0;i<BODIES.length;i++){
    var b=BODIES[i];
    var hr=Math.max(b.r*(b.ext||1)*.9+6,18);
    var d=Math.hypot(b.x-x,b.y-y);
    if(d<=hr&&d/hr<bd){bd=d/hr;best=b;}
  }
  return best;
}
cv.addEventListener('pointermove',function(e){
  if(e.pointerType==='touch')return;
  var b=pickAt(e);hoverId=b?b.id:null;cv.style.cursor=b?'pointer':'default';
});
cv.addEventListener('pointerleave',function(){hoverId=null;});
cv.addEventListener('click',function(e){
  var b=pickAt(e);
  if(b)choose(b.id);else if(mode==='explore')closePanel();
});

function markChips(){
  var els=chips.querySelectorAll('.chip');
  for(var i=0;i<els.length;i++){els[i].setAttribute('aria-pressed',els[i].getAttribute('data-id')===sel?'true':'false');}
}
function choose(id){if(mode==='quiz')answer(id);else openPanel(id);}
function openPanel(id){
  var b=BYID[id];if(!b)return;
  sel=id;
  $('pname').textContent=b.name;
  $('ptag').textContent=b.type;
  $('orb').style.background='radial-gradient(circle at 35% 30%,'+b.c[0]+','+b.c[1]+' 55%,'+b.c[2]+')';
  $('pfacts').innerHTML=b.facts.map(function(f){return '<div'+(f[2]?' class="w"':'')+'><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>';}).join('');
  $('pfun').textContent=b.fun;
  panel.scrollTop=0;
  panel.classList.add('open');
  markChips();
}
function closePanel(){sel=null;panel.classList.remove('open');markChips();}
$('pclose').addEventListener('click',function(){if(mode==='quiz'&&quiz&&!quiz.answered)return;closePanel();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&mode==='explore')closePanel();});

$('bplay').addEventListener('click',function(){paused=!paused;this.textContent=paused?'Continuar':'Pausar';});
$('rspeed').value=String(speed);
function showSpeed(){$('ospeed').textContent=String(speed).replace('.',',')+'×';}
showSpeed();
$('rspeed').addEventListener('input',function(){speed=parseFloat(this.value)||1;showSpeed();});
$('borb').addEventListener('click',function(){showOrbits=!showOrbits;this.setAttribute('aria-pressed',String(showOrbits));});
$('blab').addEventListener('click',function(){showLabels=!showLabels;this.setAttribute('aria-pressed',String(showLabels));});

/* seletor de sistema (e link direto pelo # da página) */
var selSys=$('sys');
SYSTEMS.forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.name;selSys.appendChild(o);});
function findSys(id){for(var i=0;i<SYSTEMS.length;i++){if(SYSTEMS[i].id===id)return SYSTEMS[i];}return null;}
selSys.addEventListener('change',function(){
  var s=findSys(this.value);if(!s)return;
  setSystem(s);
  try{location.hash=s.id;}catch(e){}
});
window.addEventListener('hashchange',function(){
  var s=findSys((location.hash||'').replace('#',''));
  if(s&&s!==cur)setSystem(s);
});

/* ---------- Desafio ---------- */
var qcount=$('qcount'),qscore=$('qscore'),qtext=$('qtext'),qfb=$('qfb'),qnext=$('qnext');
function startQuiz(){
  if(!cur.questions.length)return;
  var pool=cur.questions.slice().sort(function(){return Math.random()-.5;}).slice(0,Math.min(5,cur.questions.length));
  quiz={pool:pool,i:0,score:0,tries:0,answered:false,done:false};
  mode='quiz';closePanel();
  stage.classList.add('quizmode');quizEl.hidden=false;
  renderQuiz();
}
function exitQuiz(){
  mode='explore';quiz=null;quizEl.hidden=true;stage.classList.remove('quizmode');closePanel();
}
function renderQuiz(){
  var q=quiz;
  if(q.done){
    qcount.textContent='Fim do desafio';qscore.textContent='';
    qtext.textContent='Você acertou de primeira '+q.score+' de '+q.pool.length+'.';
    qfb.className='q-fb'+(q.score>=Math.ceil(q.pool.length*.6)?' ok':'');
    qfb.textContent=q.score===q.pool.length?'Perfeito! Você conhece bem este sistema.':(q.score>=Math.ceil(q.pool.length*.6)?'Muito bem!':'Explore as fichas mais um pouco e tente de novo.');
    qnext.textContent='Jogar de novo';qnext.hidden=false;
    return;
  }
  qcount.textContent=cur.name+' · pergunta '+(q.i+1)+' de '+q.pool.length;
  qscore.textContent='Acertos: '+q.score;
  qtext.textContent=q.pool[q.i].q;
  qfb.className='q-fb';qfb.textContent='Clique no astro certo.';
  qnext.hidden=true;
}
function answer(id){
  var q=quiz;
  if(!q||q.answered||q.done)return;
  var c=q.pool[q.i];
  if(id===c.a){
    q.answered=true;
    if(q.tries===0)q.score++;
    qscore.textContent='Acertos: '+q.score;
    qfb.className='q-fb ok';
    qfb.textContent='Correto! Veja a ficha de '+BYID[id].name+'.';
    qnext.textContent=q.i===q.pool.length-1?'Ver resultado':'Próxima pergunta';
    qnext.hidden=false;
    openPanel(id);
  }else{
    q.tries++;
    qfb.className='q-fb bad';
    void qfb.offsetWidth;
    qfb.className='q-fb bad shake';
    qfb.textContent=BYID[id].name+' não é a resposta. Tente de novo.';
  }
}
qnext.addEventListener('click',function(){
  if(!quiz)return;
  if(quiz.done){startQuiz();return;}
  quiz.i++;quiz.tries=0;quiz.answered=false;
  closePanel();
  if(quiz.i>=quiz.pool.length)quiz.done=true;
  renderQuiz();
});
$('qexit').addEventListener('click',exitQuiz);
$('bquiz').addEventListener('click',startQuiz);

/* ---------- Início ---------- */
setSystem(findSys((location.hash||'').replace('#',''))||SYSTEMS[0]);
fade=1;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
